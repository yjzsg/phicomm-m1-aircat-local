# 悟空M1 本地化：一个容器同时做「假 aircat 服务器」和「定向 DNS 劫持」
#
# 部署前必须改的地方（搜 CHANGE_ME / aabbccddeeff / eth0 / 192.168.1.）：
#   MQTT_PASS    —— 你的 MQTT 密码
#   aabbccddeeff —— 换成你自己设备的 MAC（小写、无冒号）
#   IFACE        —— 服务器上连局域网的网卡名（`ip -br link` 查看）
#   M1_IP / GW_IP / FAKE_IP —— 设备 IP / 网关 IP / 假服务器 IP
#   CLOUD_ALIAS_IP —— 假云端用的独立 IP（不能和本机 IP 相同，见 README）
#
# 关于 ARP_SPOOF：
#   默认 "1"，用 ARP 欺骗把 M1 的流量引到本机，零配置可用。
#   若你的路由器能给单个终端指定网关（如 iKuai 的 DHCP 静态分配），
#   把 M1 的网关设成本机 IP 后改成 "0"，就不再需要欺骗 —— 更干净，
#   见 README「可选：用路由器代替 ARP 欺骗」。
#
# 拿 MAC：路由器 DHCP 列表里找 OUI 为 b0:f8:93（MXCHIP/庆科）的设备。

services:
  aircat:
    image: python:3.12-alpine
    container_name: aircat-fake
    restart: unless-stopped
    network_mode: host
    # DNS 劫持需要：发伪造 ARP 应答（NET_RAW）+ 抓原始 DNS 包（NET_ADMIN）
    cap_add:
      - NET_RAW
      - NET_ADMIN
    mem_limit: 64m
    environment:
      # ---- MQTT（要和 Home Assistant 用同一个 broker）----
      MQTT_HOST: "127.0.0.1"
      MQTT_PORT: "1883"
      MQTT_USER: "homeassistant"
      MQTT_PASS: "CHANGE_ME"
      MQTT_TOPIC_RAW: "aircat/raw"
      # 下面三个主题要和 HA 的配置一致
      MQTT_TOPIC_HA: "device/zm1/aabbccddeeff/sensor"
      MQTT_TOPIC_STATE: "device/zm1/aabbccddeeff/state"
      MQTT_TOPIC_SET: "device/zm1/aabbccddeeff/set"
      # ---- 定向 DNS / ARP 劫持 ----
      IFACE: "eth0"
      M1_IP: "192.168.1.54"
      M1_MAC: "aabbccddeeff"
      GW_IP: "192.168.1.1"
      FAKE_IP: "192.168.1.6"
      TARGET_DOMAIN: "aircat.phicomm.com"
      # 假云端：应答设备的 /device/active 激活请求（设备不校验证书）
      FAKE_CLOUD_PORT: "9443"
      FAKE_CLOUD_CERT: "/data/cloud.crt"
      FAKE_CLOUD_KEY: "/data/cloud.key"
      UPSTREAM_DNS: "192.168.1.1"
    # DNS 劫持跑在后台（日志加 [dns] 前缀区分），服务器跑在前台。
    # 服务器退出 -> 容器退出 -> restart 策略拉起，两个进程一起恢复。
    command: >
      sh -c "python3 /scripts/m1_dns_redirect.py 2>&1 | sed 's/^/[dns] /' &
             python3 /scripts/m1_fake_cloud.py 2>&1 | sed 's/^/[cloud] /' &

             exec python3 /scripts/aircat_server.py"
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data            # aircat.log 写在这里，排障时看它
